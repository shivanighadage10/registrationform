<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Advanced Registration Form</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="p-4">
  <div class="container">
    <h2 class="mb-4">Advanced Registration Form</h2>
    <form id="registrationForm">

      <div class="mb-3">
        <label for="fullName" class="form-label">Full Name</label>
        <input type="text" class="form-control" id="fullName" placeholder="Enter full name" required>
      </div>

      <div class="mb-3">
        <label for="aadhar" class="form-label">Aadhar Number</label>
        <input type="text" class="form-control" id="aadhar" maxlength="12" placeholder="12-digit number" required>
      </div>

      <div class="mb-3">
        <label for="pan" class="form-label">PAN Card Number</label>
        <input type="text" class="form-control" id="pan" placeholder="ABCDE1234F" required>
      </div>

      <div class="mb-3">
        <label for="mobile" class="form-label">Mobile Number</label>
        <input type="text" class="form-control" id="mobile" maxlength="10" placeholder="10-digit mobile" required>
      </div>

      <div class="mb-3">
        <label for="dob" class="form-label">Date of Birth</label>
        <input type="date" class="form-control" id="dob" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Marks for 6 Subjects (Out of 100)</label>
        <div class="row">
          <div class="col"><input type="number" class="form-control mark" min="0" max="100" placeholder="Subject 1" required></div>
          <div class="col"><input type="number" class="form-control mark" min="0" max="100" placeholder="Subject 2" required></div>
          <div class="col"><input type="number" class="form-control mark" min="0" max="100" placeholder="Subject 3" required></div>
        </div>
        <div class="row mt-2">
          <div class="col"><input type="number" class="form-control mark" min="0" max="100" placeholder="Subject 4" required></div>
          <div class="col"><input type="number" class="form-control mark" min="0" max="100" placeholder="Subject 5" required></div>
          <div class="col"><input type="number" class="form-control mark" min="0" max="100" placeholder="Subject 6" required></div>
        </div>
      </div>

      <div class="mb-3">
        <button type="submit" class="btn btn-primary">Submit</button>
      </div>

      <div id="result" class="alert alert-info d-none"></div>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
